[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push only touches docs or launcher scripts
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web content netlify scripts package.json package-lock.json netlify.toml"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
